name: 🚀 Blog CI/CD & Deep GitHub Automation

# Tự động kích hoạt khi có commit đẩy lên nhánh main hoặc kích hoạt thủ công từ giao diện
on:
  push:
    branches: ["main"]
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ────────────────────────────────────────────────────────────
  # 1. BẢO MẬT: QUÉT TỰ ĐỘNG KHÔNG ĐỂ LỘ KEY / TOKEN / SECRET
  # ────────────────────────────────────────────────────────────
  security-audit:
    name: 🛡️ Quét Bảo Mật & Rò Rỉ Secret
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Tải mã nguồn
        uses: actions/checkout@v4

      - name: 🔍 Rà soát API Key & Token nhạy cảm
        run: |
          echo "Bắt đầu rà soát toàn bộ tệp tin trong blog..."
          if grep -rnE "(ghp_[a-zA-Z0-9]{36}|gho_[a-zA-Z0-9]{36}|sk-[a-zA-Z0-9]{20,}|AKIA[0-9A-Z]{16})" blog/ --exclude-dir=".git" 2>/dev/null; then
            echo "::error title=Bảo mật thất bại::Phát hiện API Key hoặc Token trong mã nguồn! Hãy xóa ngay."
            exit 1
          fi
          echo "✅ Mã nguồn an toàn! Không có API Key công khai nào bị lộ."

      - name: 🛑 Ngăn chặn tệp cấm (.env, *.key, *.pem)
        run: |
          FORBIDDEN=$(find . -type f \( -name "*.env" -o -name ".env.*" -o -name "*.pem" -o -name "*.key" -o -name "*.p12" -o -name "*.pfx" \) 2>/dev/null)
          if [ -n "$FORBIDDEN" ]; then
            echo "::error title=Tệp nhạy cảm::Phát hiện tệp tin cấm đẩy lên kho lưu trữ: $FORBIDDEN"
            exit 1
          fi
          echo "✅ Không phát hiện tệp tin môi trường hoặc khóa bí mật."

  # ────────────────────────────────────────────────────────────
  # 2. TỰ ĐỘNG HÓA SÂU: ĐỒNG BỘ NỘI DUNG, SEO & TRIỂN KHAI
  # ────────────────────────────────────────────────────────────
  master-build-and-deploy:
    name: ⚡ Tự Động Hóa Blog & Triển Khai GitHub Pages
    needs: security-audit
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 📥 Tải mã nguồn đầy đủ
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Thiết lập môi trường Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ⚙️ Chạy Quy Trình Master Automation (Đồng bộ HTML, SEO, RSS, README)
        run: |
          echo "Đang thực thi master-build.js..."
          node blog/scripts/master-build.js

      - name: 📊 Tạo Báo Cáo Triển Khai (GitHub Action Step Summary)
        run: |
          echo "### 🚀 Kết Quả Tự Động Hóa Blog leanhminh2104" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Hạng mục | Trạng thái | Chi tiết |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 🛡️ Bảo mật | ✅ Đã vượt qua | Quét sạch API key & file .env |" >> $GITHUB_STEP_SUMMARY
          echo "| 📄 HTML Đồng bộ | ✅ Thành công | Cập nhật index.html, tech, life & bài viết chi tiết |" >> $GITHUB_STEP_SUMMARY
          echo "| 🗺️ Sitemap XML | ✅ Đã tạo mới | Hỗ trợ Google Search Console |" >> $GITHUB_STEP_SUMMARY
          echo "| 📡 RSS Feed 2.0 | ✅ Đã tạo mới | Độc giả theo dõi qua feed.xml |" >> $GITHUB_STEP_SUMMARY
          echo "| 📝 GitHub README | ✅ Đã đồng bộ | Danh sách bài viết mới nhất trên Profile |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🌐 **Website Trực Tiếp:** [https://leanhminh2104.github.io/blog/](https://leanhminh2104.github.io/blog/)" >> $GITHUB_STEP_SUMMARY

      - name: 💾 Tự động lưu & Commit các tệp đã đồng bộ trở lại Kho lưu trữ
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add blog/*.html blog/**/*.html blog/sitemap.xml blog/robots.txt blog/feed.xml README.md || true
          git diff --staged --quiet || git commit -m "chore(auto): deep sync HTML post grids, SEO sitemap & RSS [skip ci]"
          git push origin main || true

      - name: 🔧 Thiết lập GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📦 Đóng gói gói xuất bản (Pages Artifact)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 🚀 Triển khai lên GitHub Pages (Zero-Downtime)
        id: deployment
        uses: actions/deploy-pages@v4