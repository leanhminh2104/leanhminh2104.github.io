<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 268 42" width="268" height="42" class="logo-svg-brand" aria-label="LEANHMINH2104">
  <defs>
    <!-- Soft Glow Filter for Neon Atmosphere -->
    <filter id="lm-aura-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="lm-text-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Squircle Border Gradient -->
    <linearGradient id="lm-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <!-- Monogram Ribbon Gradient L -->
    <linearGradient id="lm-ribbon-l" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Monogram Ribbon Gradient M -->
    <linearGradient id="lm-ribbon-m" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#38bdf8;#f472b6;#c084fc" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#818cf8;#c084fc;#a855f7" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Full Cosmic Neon Gradient for LEANHMINH2104 Wordmark -->
    <linearGradient id="lm-full-wordmark-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#c084fc;#f472b6;#38bdf8" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="35%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#38bdf8;#c084fc;#818cf8" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="70%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#f472b6;#38bdf8;#c084fc" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#f472b6">
        <animate attributeName="stop-color" values="#f472b6;#a855f7;#38bdf8;#f472b6" dur="7s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <!-- ==================== 1. EMBLEM: ORIGAMI MONOGRAM LM (MẪU 2) ==================== -->
  <g transform="translate(3, 3)" class="brand-monogram">
    <!-- Ambient Aura Glow -->
    <rect x="0" y="0" width="36" height="36" rx="10" fill="#a855f7" opacity="0.35" filter="url(#lm-aura-glow)"/>

    <!-- Squircle Body -->
    <rect x="0" y="0" width="36" height="36" rx="10" fill="#0d0f1f"/>
    <rect x="0" y="0" width="36" height="36" rx="10" fill="none" stroke="url(#lm-border-grad)" stroke-width="1.5"/>
    <rect x="1.5" y="1.5" width="33" height="33" rx="8.5" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

    <!-- Stylized Geometric LM Vector Ribbon -->
    <g transform="translate(1, 0)">
      <!-- Letter L (Cyan to Indigo Ribbon) -->
      <path d="M 10 11.5 L 10 24.5 L 17 24.5" fill="none" stroke="url(#lm-ribbon-l)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Letter M (Origami Ribbon folding from L's base) -->
      <path d="M 16.5 24.5 L 20 15 L 23.5 21.5 L 27 15 L 27 24.5" fill="none" stroke="url(#lm-ribbon-m)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Core Energy Spark -->
      <circle cx="23.5" cy="21.5" r="1.3" fill="#ffffff" opacity="0.95"/>
    </g>
  </g>

  <!-- ==================== 2. WORDMARK: TRUE ORBITRON 900 VECTOR PATH ==================== -->
